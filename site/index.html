  // ===== SFD v2 · efeitos (scroll suave, reveal, parallax, cursor, header) =====
  fxInit() {
    const d = document, w = window;
    const rm = w.matchMedia && w.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const fine = w.matchMedia && w.matchMedia('(hover: hover) and (pointer: fine)').matches;
    let lastY = w.scrollY || 0, tick = false;
    const upd = () => {
      tick = false;
      const y = w.scrollY || 0, max = d.documentElement.scrollHeight - w.innerHeight;
      const p = d.querySelector('.v2-progress'); if (p) p.style.transform = 'scaleX(' + (max > 0 ? Math.min(1, y / max) : 0) + ')';
      const h = d.querySelector('.v2-header');
      if (h) { h.classList.toggle('scrolled', y > 40); h.classList.toggle('hide', y > lastY + 2 && y > 320 && !this.state.menuOpen); if (y < lastY - 2 || y < 320) h.classList.remove('hide'); }
      lastY = y;
      if (!rm) {
        d.querySelectorAll('[data-parallax]').forEach((el) => {
          const box = el.parentElement.getBoundingClientRect();
          if (box.bottom < -200 || box.top > w.innerHeight + 200) return;
          const sp = parseFloat(el.getAttribute('data-parallax')) || 0.15;
          el.style.transform = 'translate3d(0,' + (-box.top * sp).toFixed(1) + 'px,0) scale(1.08)';

      }
    };

      const scan = () => d.querySelectorAll('.reveal:not([data-io])').forEach((el) => { el.setAttribute('data-io', '1'); if (rm) el.classList.add('in'); else this._fxIO.observe(el); });

    const NEWS = (window.SFDContent && window.SFDContent.get('news')) || [{"slug": "renovacao-andre-couto", "title": "RENOVAÇÃO · ANDRÉ COUTO", "date": "23.06.2026", "iso": "2026-06-23", "cat": "Clube", "img": "/assets/c79bcbed7dc7c8c0dba60f90deeda7f8.jpg", "body": ["O SF Damaiense tem o orgulho de anunciar a continuidade de André Couto como treinador principal da equipa sénior para a época 2026/27.", "Ligado ao clube há 9 anos, André Couto representa na perfeição os valores e a identidade do Damaiense, tendo deixado a sua marca tanto como jogador como no papel de treinador.", "Ao longo deste percurso de dedicação, compromisso e paixão pelo nosso emblema, alcançou este ano um dos momentos mais marcantes da sua caminhada no clube: a conquista da subida de divisão de Juniores para a 1.ªDistrital, resultado do trabalho, união e ambição demonstrados por toda a equipa.", "A renovação de André Couto reforça a aposta na continuidade de um projeto sólido, assente no conhecimento da casa e na vontade de levar o SF Damaiense cada vez mais longe.", "Parabéns, Mister! Que a nova época seja repleta de sucessos."], "min": 1, "src": "https://sfdamaiense.emjogo.pt/pt/noticias/renovacao-andre-couto/"}, {"slug": "bem-vindos-de-volta-a-casa", "title": "Bem-vindos de volta a casa!", "date": "22.06.2026", "iso": "2026-06-22", "cat": "Clube", "img": "/assets/177e6ac4455c70ec993e8c19024c9402.jpg", "body": ["O SF Damaiense tem o enorme prazer de anunciar o regresso de duas figuras que fazem parte da história do nosso clube.", "Ricardo Pereira “Ricardinho” assume funções como Diretor Desportivo da equipa sénior. Antigo jogador das nossas camadas jovens e da nossa equipa sénior e treinador, regressa a uma casa que bem conhece, trazendo consigo anos de dedicação, experiência e paixão pelo nosso clube", "João Coimbra “Chipy” integra a estrutura como Team Manager. Com mais de 15 anos de ligação ao clube, destacou-se como jogador e treinador da nossa formação e equipa sénior, sendo uma referência de compromisso, identidade e espírito damaiense.", "Dois homens da casa, dois exemplos de dedicação ao nosso emblema, que agora abraçam um novo desafio ao serviço da equipa sénior.", "Desejamos ‘Chipy’ e ‘Ricardinho’ os maiores sucessos nesta nova etapa.", "Juntos, continuaremos a construir o futuro do SF Damaiense!"], "min": 1, "src": "https://sfdamaiense.emjogo.pt/pt/noticias/bem-vindos-de-volta-a-casa/"}, {"slug": "os-nossos-juniores-sao-de-1a", "title": "Os nossos Juniores são de 1.ª!", "date": "23.05.2026", "iso": "2026-05-23", "cat": "Formação", "img": "/assets/6a42ae5c06b00db2f0423dfd83c83c35.jpg", "body": ["É oficial: os nossos Juniores garantiram a subida à 1.ª Divisão! Um feito extraordinário que recompensa o trabalho, a dedicação e o espírito de sacrifício demonstrados ao longo de toda a época.", "Os nossos jovens atletas demonstraram, dentro e fora de campo, os valores que representam o clube: compromisso, ambição, respeito e paixão pelo futebol. Hoje celebramos uma subida de divisão, mas também o crescimento de um grupo que nunca deixou de acreditar nos seus sonhos.", "Parabéns Craques!", "Os nossos Juniores são de 1.ª!", "Parabéns, campeões! O Damaiense orgulha-se de vocês."], "min": 1, "src": "https://sfdamaiense.emjogo.pt/pt/noticias/os-nossos-juniores-sao-de-1a/"}, {"slug": "novo-coordenador-tecnico-do-damaiense", "title": "Novo Coordenador Técnico do Damaiense", "date": "19.04.2026", "iso": "2026-04-19", "cat": "Clube", "img": "/assets/d6bc4e51f7ba3e1e89682c716576220c.jpg", "body": ["O Damaiense tem o prazer de anunciar a nomeação de Pedro Mota como novo Coordenador Técnico do clube.", "Esta decisão reflete a total confiança na sua competência, no seu percurso e na forma como entende o futebol — assente na ambição, no rigor e no verdadeiro espírito de equipa", "Identificado com os valores que orientam o Damaiense — dedicação, compromisso e desenvolvimento integral dos atletas — Pedro Mota assume este desafio com uma visão estratégica alinhada com a direção. A sua chegada representa um passo importante para a consolidação e crescimento sustentado do nosso projeto desportivo", "Iniciamos, assim, um novo ciclo com confiança, responsabilidade e determinação, preparados para enfrentar os desafios futuros e continuar a elevar o nome do Damaiense", "#SomosDamaiense #Desde1938"], "min": 1, "src": "https://sfdamaiense.emjogo.pt/pt/noticias/novo-coordenador-tecnico-do-damaiense/"}, {"slug": "mensagem-pascoa-2026", "title": "Mensagem Páscoa 2026", "date": "05.04.2026", "iso": "2026-04-05", "cat": "Clube", "img": "/assets/7f9e413f355b561efcab64e3d009b81a.jpg", "body": ["O SF Damaiense deseja a todos os seus atletas, famílias, sócios, adeptos e parceiros uma Páscoa repleta de saúde, união e momentos de verdadeira partilha.", "Que esta época especial simbolize renovação, esperança e motivação para continuarmos, juntos, a representar o clube com dedicação, respeito e um forte espírito de equipa.", "Seguimos unidos, dentro e fora de campo, com o compromisso de crescer e honrar os valores que nos definem.", "Feliz Páscoa!"], "min": 1, "src": "https://sfdamaiense.emjogo.pt/pt/noticias/mensagem-pascoa-2026/"}, {"slug": "assembleia-geral-convocatoria", "title": "Assembleia Geral - Convocatória", "date": "28.03.2026", "iso": "2026-03-28", "cat": "Clube", "img": "/assets/49098648fb7d60d323204f2bafb40cd6.jpg", "body": ["O SF Damaiense informa todos os seus sócios que a Assembleia Geral terá lugar hoje, pelas 17h30.", "A participação dos associados é de extrema importância, sendo fundamental para a definição do futuro e crescimento do clube.", "A Direção apela à presença de todos os sócios neste momento relevante da vida do clube."], "min": 1, "src": "https://sfdamaiense.emjogo.pt/pt/noticias/assembleia-geral-convocatoria/"}, {"slug": "feliz-dia-do-pai", "title": "Feliz dia do Pai", "date": "19.03.2026", "iso": "2026-03-19", "cat": "Clube", "img": "/assets/05ad05171a090af6f8852f3e03d44b0b.jpg", "body": ["Hoje celebramos aqueles que, desde o primeiro momento, nos ensinaram muito mais do que palavras — ensinaram-nos a sentir, a viver e a acreditar.", "Ser pai é representar força, dedicação e presença constante. É estar ao lado nos desafios e nas conquistas, dentro e fora de qualquer campo. É liderar pelo exemplo, inspirar com atitudes e transmitir valores que se carregam para toda a vida.", "Ser pai também é cultivar uma paixão silenciosa, um orgulho que não precisa de explicação — apenas se sente. É construir laços, histórias e memórias que atravessam gerações.", "A todos os pais que fazem parte da nossa comunidade, o nosso sincero agradecimento por caminharem connosco e ajudarem a dar sentido a tudo o que somos.", "Feliz Dia do Pai. ", "#SomosDamaiense"], "min": 1, "src": "https://sfdamaiense.emjogo.pt/pt/noticias/feliz-dia-do-pai/"}, {"slug": "patrono-damaiense-pascoa-cup", "title": "Patrono Damaiense Páscoa Cup", "date": "12.03.2026", "iso": "2026-03-12", "cat": "Formação", "img": "/assets/4aa4a45d62285887e59120b638882dc0.jpg", "body": ["Natural da Damaia, Diogo Prioste nunca escondeu o carinho pelo SF Damaiense. Mesmo sem nunca ter representado o clube, cresceu a assistir aos jogos e a viver de perto a paixão pelo futebol no nosso bairro.", "Agora, como Capitão do SL Benfica B, aceitou sem hesitar o convite para ser Patrono Oficial da XI edição do Damaiense Páscoa Cup 2026.", "Para o Diogo, este convite é um verdadeiro privilégio e também uma forma de reviver a infância, vendo os mais jovens espalhar talento dentro de campo… e quem sabe se entre eles não estará um futuro craque a seguir os seus passos.", "O nosso muito obrigado ao Diogo por aceitar fazer parte desta edição!", "A Damaia orgulha-se de ti", "#PatronoOficial #DamaiensePascoaCup2026"], "min": 1, "src": "https://sfdamaiense.emjogo.pt/pt/noticias/patrono-damaiense-pascoa-cup/"}, {"slug": "celebracao-dia-da-mulher", "title": "Celebração Dia da Mulher", "date": "08.03.2026", "iso": "2026-03-08", "cat": "Clube", "img": "/assets/7e097ec578ff17747fd20662427c4ed2.jpg", "body": ["Durante o fim de semana celebrámos o Dia da Mulher de uma forma muito especial", "Antes do início do jogo, os nossos jogadores entraram em campo acompanhados pelas “suas” mulheres, num gesto simbólico de respeito, reconhecimento e agradecimento a todas aquelas que fazem parte das nossas vidas e do nosso Damaiense", "Um pequeno momento, mas cheio de significado, para homenagear a força, a dedicação e a inspiração que as mulheres representam todos os dias.", "Este foi um resumo do nosso grande Dia da Mulher no Damaiense"], "min": 1, "src": "https://sfdamaiense.emjogo.pt/pt/noticias/celebracao-dia-da-mulher/"}, {"slug": "andre-salvado-deixa-funcoes-no-sport-futebol-damaiense", "title": "André Salvado deixa funções no SF Damaiense", "date": "08.03.2026", "iso": "2026-03-08", "cat": "Clube", "img": "/assets/80966fafc93534d52886d222d3742aa3.jpg", "body": ["O SF Damaiense informa que André Salvado cessa hoje as suas funções como treinador da equipa sénior e coordenador de futebol do clube.", "Esta decisão foi tomada por mútuo acordo e resulta exclusivamente de uma decisão pessoal do treinador, a qual o clube respeita na totalidade.", "André Salvado deixa um legado marcante na história recente do Damaiense, tendo representado o clube com enorme dedicação ao longo de vários anos e em diferentes funções. Iniciou o seu percurso como jogador, assumiu posteriormente responsabilidades como treinador da formação, coordenador do futebol e, mais recentemente, liderou a nossa equipa sénior.", "Ao longo deste percurso, destacou-se pelo profissionalismo, compromisso e profunda ligação ao clube, contribuindo de forma significativa para o crescimento e afirmação do projeto desportivo do Damaiense.", "O SF Damaiense agradece sinceramente todo o trabalho, dedicação e paixão demonstrados.", "Desejamos ao André Salvado os maiores sucessos pessoais e profissionais para o futuro.", "Esta será sempre a tua casa.", "Obrigado por tudo, Mister."], "min": 1, "src": "https://sfdamaiense.emjogo.pt/pt/noticias/andre-salvado-deixa-funcoes-no-sport-futebol-damaiense/"}, {"slug": "xi-edicao-damaiense-pascoa-cup-2026", "title": "XI Edição Damaiense Páscoa CUP 2026", "date": "24.02.2026", "iso": "2026-02-24", "cat": "Formação", "img": "/assets/d44e49cff902050ffc80363b25f54567.jpg", "body": ["A XI Edição do Damaiense Páscoa CUP 2026 já tem data marcada e promete voltar a ser um dos grandes momentos do futebol de formação nesta época desportiva.", "O torneio irá decorrer entre 30 de março e 4 de abril de 2026, reunindo alguns dos clubes mais emblemáticos da região e proporcionando uma semana repleta de competição, fair-play, convívio e paixão pelo futebol.", "Escalões em Competição: Petizes, Traquinas, Benjamins, Infantis", "Durante seis dias, jovens atletas terão a oportunidade de competir num ambiente organizado, competitivo e formativo, promovendo os valores do desporto, da amizade e do respeito.", "Equipas Confirmadas", "A edição de 2026 contará já com as seguintes equipas confirmadas:", "Clube de Futebol Benfica (Fofó)", "Estrela da Amadora", "Real Massamá", "Sport Lisboa Benfica", "Futebol Clube Outurela", "REP Tenente Valdez", "CD Olivais e Moscavide", "Casa Pia", "UDR Algés", "Mais equipas poderão ser anunciadas brevemente.", "O Damaiense Páscoa CUP continua a afirmar-se como uma referência no futebol jovem, proporcionando uma experiência única a atletas, treinadores, famílias e adeptos.", "Fique atento às próximas novidades, calendário de jogos e informações adicionais que serão divulgadas em breve.", "30 de março a 4 de abril de 2026", "XI Damaiense Páscoa CUP 2026", "Ainda vais a tempo de garantir o teu lugar no melhor torneio da Páscoa! ", "Garante já a tua inscrição para torneios@sfdamaiense.pt "], "min": 2, "src": "https://sfdamaiense.emjogo.pt/pt/noticias/xi-edicao-damaiense-pascoa-cup-2026/"}, {"slug": "joao-lavado-e-o-novo-presidente-do-sport-futebol-damaiense", "title": "João Lavado é o novo Presidente do SF Damaiense", "date": "02.02.2026", "iso": "2026-02-02", "cat": "Clube", "img": "/assets/190faba7b878838a8bb9c0438bcf85eb.jpg", "body": ["O SF Damaiense anuncia, com grande entusiasmo, a eleição de João Lavado como novo Presidente do clube.", "Assumindo esta função com um profundo sentido de responsabilidade, dedicação e paixão pelo Damaiense, João Lavado inicia um novo ciclo de liderança com o compromisso de deixar uma marca duradoura na história do clube. A sua presidência tem como pilares a excelência desportiva, o fortalecimento da estrutura do clube e a promoção do bem-estar de todos os atletas, sócios e colaboradores.", "A visão do novo Presidente assenta no crescimento sustentável do SF Damaiense, na superação contínua de desafios e na valorização do espírito de família que sempre caracterizou o clube. Acreditando que o sucesso se constrói em conjunto, João Lavado reforça a importância da união entre direção, atletas, equipa técnica, sócios e adeptos.", "Este novo capítulo representa uma oportunidade para consolidar valores, honrar a história do Damaiense e projetar o clube para um futuro ainda mais ambicioso.", "O SF Damaiense expressa o seu mais profundo agradecimento à Presidente cessante Sónia Santos e a toda a sua Direção pelo trabalho, dedicação e compromisso demonstrados ao longo dos dois mandatos ao serviço do nosso clube.", "Viva o Damaiense! ", "Desde 1938, a dignificar e honrar o nosso emblema."], "min": 2, "src": "https://sfdamaiense.emjogo.pt/pt/noticias/joao-lavado-e-o-novo-presidente-do-sport-futebol-damaiense/"}, {"slug": "88-anos-de-historia", "title": "88 Anos de História", "date": "01.01.2026", "iso": "2026-01-01", "cat": "Clube", "img": "/assets/f7c6c4424d4b8208f42eef2d52d69ec5.jpg", "body": ["88 Anos de História! Um Orgulho que Atravessa Gerações.", "Desde 1938, o SF Damaiense é mais do que um clube — é identidade, paixão e pertença. São 88 anos de história feitos de conquistas, desafios superados e de um amor incondicional às nossas cores.", "Cada jogo, cada atleta, cada sócio e adepto ajudaram a construir este legado que atravessa gerações e continua vivo dentro e fora do campo. O passado honra-nos, o presente move-nos e o futuro chama-nos a continuar a escrever a nossa história com ambição, união e respeito pelos valores que nos definem.", "O Damaiense não é apenas o que foi.", "É tudo o que somos.", "E tudo o que ainda vamos ser.", "Desde 1938. Sempre Damaiense."], "min": 1, "src": "https://sfdamaiense.emjogo.pt/pt/noticias/88-anos-de-historia/"}, {"slug": "feliz-natal", "title": "Feliz Natal", "date": "15.12.2025", "iso": "2025-12-15", "cat": "Clube", "img": "/assets/c0b9399350acde1928ab5e83297decd4.jpg", "body": ["O Sport Futebol Damaiense deseja a todos os seus atletas, treinadores, dirigentes, sócios, adeptos e parceiros um Santo e Feliz Natal.", "Que esta época seja vivida com união, alegria e espírito de equipa — os mesmos valores que nos movem diariamente dentro e fora do campo. Que o novo ano traga saúde, sucesso desportivo e muitas conquistas, sempre com o Damaiense no coração. ", "Obrigado por fazerem parte da nossa família.", "Juntos, continuamos a construir o futuro!  "], "min": 1, "src": "https://sfdamaiense.emjogo.pt/pt/noticias/feliz-natal/"}, {"slug": "no-damaiense-jogamos-juntos-e-fora-do-relvado", "title": "No Damaiense, jogamos juntos e fora do relvado", "date": "08.10.2025", "iso": "2025-10-08", "cat": "Clube", "img": "/assets/d8eee4d6a81af3f034c6e0bb65266030.jpg", "body": ["Outubro Rosa: A Prevenção é a Melhor Jogada!", "Neste Outubro Rosa, lembramos que a prevenção é a melhor jogada — e que juntos podemos vencer o cancro da mama!", "Durante este mês, multiplicam-se as ações de sensibilização que têm como objetivo alertar para a importância do diagnóstico precoce e para os cuidados com a saúde da mulher.", "O cancro da mama é um dos tipos mais comuns entre as mulheres, mas quando detetado a tempo, as hipóteses de cura podem ultrapassar os 90%. Por isso, é fundamental realiz
