[build]
  publish = "site"
  functions = "netlify/functions"
  # Se as imagens estiverem na pasta assets/ da raiz do repositório, são copiadas para site/assets/ antes de publicar.
  command = "(if [ -d assets ]; then mkdir -p site/assets && cp -R assets/. site/assets/; fi) && node scripts/write-config.mjs && npm run build"

[build.environment]
  NODE_VERSION = "22"

# Painel: nunca indexado, nunca em cache, política de conteúdo restrita.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
    X-Frame-Options = "DENY"
    Referrer-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "no-cache"

[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301

# Rede de segurança: se uma imagem não estiver em site/assets/ (ex.: enviada para a pasta site/),
# o Netlify procura-a na raiz do site. Só atua quando o ficheiro original não existe.
[[redirects]]
  from = "/assets/admin/*"
  to = "/:splat"
  status = 200

[[redirects]]
  from = "/assets/*"
  to = "/:splat"
  status = 200
